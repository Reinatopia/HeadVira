<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klik Kepala!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Karakter -->
        <img src="karakter.png" alt="Karakter" class="char-img" id="character">
        
        <!-- Area Klik (Hitbox) -->
        <div class="head-hitbox" id="headClick"></div>
        
        <!-- Counter -->
        <p class="score">Skor: <span id="counter">0</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
